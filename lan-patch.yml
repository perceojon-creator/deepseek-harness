- id: webserver
  inject:
    - webStartup
  config:
    host: !!js ctx.webStartup.host ?? '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- insert:
    # 1. Memoria de Código y Grafo de Conocimiento (AST, llamadas, radio de impacto)
    - id: mcp-codebase-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codebase
        transport: stdio
        command: C:\Users\Admin\.local\bin\codebase-memory-mcp.exe

    # 2. Motor de Búsqueda Agéntica Tavily
    - id: mcp-tavily
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: tavily
        transport: stdio
        command: cmd.exe
        args:
          - /c
          - npx
          - -y
          - tavily-mcp
        env:
          TAVILY_API_KEY: !!js process.env.TAVILY_API_KEY ?? ''

    # 3. Navegación y Automatización con Chrome Real (Playwright)
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: cmd.exe
        args:
          - /c
          - npx
          - -y
          - '@playwright/mcp@latest'
          - '--caps=vision,pdf,network'
          - '--user-data-dir=C:\Users\Admin\playwright-chrome-profile'
          - '--executable-path=C:\Program Files\Google\Chrome\Application\chrome.exe'

    # 4. Control de Ratón, Teclado y Pantalla (Computer Use)
    - id: mcp-compumouse
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: compumouse
        transport: stdio
        command: cmd.exe
        args:
          - /c
          - npx
          - -y
          - computer-use-mcp@latest

    # 5. Gestor de Paquetes de Windows (winget)
    - id: mcp-winget
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: winget
        transport: stdio
        command: C:\Users\Admin\AppData\Local\Microsoft\WindowsApps\WindowsPackageManagerMCPServer.exe

    # 6. Plataforma Cuantitativa SQX (Habilitado para AlgoWizard y Retester)
    - id: mcp-sqx
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sqx
        transport: streamable-http
        url: 'http://localhost:8080/mcp'
        failOnStartupError: false

    # 7. Terminal Remoto Interactivo (HTTP - puerto 22346)
    - id: mcp-terminal
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: terminal
        transport: streamable-http
        url: 'http://127.0.0.1:22346/mcp'
        headers:
          Authorization: !!js "'Bearer ' + (process.env.TERMINAL_MCP_TOKEN ?? '')"
        failOnStartupError: false
        # Filesystem/web tools that duplicate native read/write/glob/grep/web_fetch.
        excludeTools:
          - read_file
          - read_file_by_lines
          - read_binary_file
          - write_file
          - write_binary_file
          - create_new_file
          - create_new_folder
          - delete_file
          - delete_folder
          - replace_text_in_file
          - find_files_by_glob
          - find_files_by_name_keyword
          - list_directory
          - search_regex
          - search_text
          - send_web_request
