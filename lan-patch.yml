    #     url: 'http://127.0.0.1:22345/mcp'
    #     headers:
    #       Authorization: !!js 'Bearer ' + (process.env.METAEDITOR_MCP_TOKEN ?? '')
    #     failOnStartupError: false

    # 12. Terminal Remoto Interactivo (HTTP - puerto 22346)
    - id: mcp-terminal
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: terminal
        transport: streamable-http
        url: 'http://127.0.0.1:22346/mcp'
        headers:
          Authorization: !!js "'Bearer ' + (process.env.TERMINAL_MCP_TOKEN ?? '')"
        failOnStartupError: false
